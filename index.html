<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23163D32%27/%3E%3C/svg%3E">
<title>Verdane — Resorts & Stays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens ===== */
:root{--bg:#FAF9F6;--green:#163D32;--ink:#202522;--gold:#C5A46D;--line:#e6e2d8;--card:#fff;--muted:#6b726d;--r:20px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:80px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* nav (soft pill + emphasised bookings circle) */
nav{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center}
.pill{display:flex;gap:4px;padding:6px;border-radius:99px}
.pill,.circ{background:linear-gradient(#fff,#f0f0ee);border:2px solid #fff;box-shadow:0 16px 32px #0000002e,0 2px 6px #0000001a}
nav button{border:0;background:none;cursor:pointer;color:#9a9a9a;display:flex;align-items:center;gap:0;height:48px;padding:0 14px;border-radius:99px;font-weight:700;font-size:.95rem;transition:background .35s ease,color .35s ease,padding .4s cubic-bezier(.4,0,.2,1),transform .15s;position:relative;-webkit-tap-highlight-color:transparent}
nav button:active{transform:scale(.94)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:#ebebea;color:#111;padding:0 20px 0 16px}
nav .hm.on svg{fill:currentColor}
.lb{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;padding-left:0;transition:max-width .4s cubic-bezier(.4,0,.2,1),opacity .3s ease,padding .4s cubic-bezier(.4,0,.2,1)}
.on .lb{max-width:90px;opacity:1;padding-left:8px}
.circ{width:60px;height:60px;border-radius:50%;padding:0;justify-content:center;color:#111}
.circ.on{padding:0}
.bd{position:absolute;top:2px;right:2px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#d93025;color:#fff;font-size:.72rem;display:grid;place-items:center;border:2px solid #fff}
.bd:empty{display:none}
@media(min-width:760px){nav{top:16px;bottom:auto}.logo{position:fixed;top:26px;left:28px;z-index:50;font-weight:800;color:#fff}}
@media(max-width:759px){.logo{display:none}}
/* pages */
.page{display:none;animation:in .35s ease}.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{min-height:84vh;display:flex;align-items:flex-end;color:#fff;background-size:cover;background-position:center;position:relative;padding:120px 0 60px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0c241dcc,#0c241d33 70%)}
.hero .wrap{position:relative;width:100%}
.hero h1{font-size:clamp(2.4rem,7vw,5rem);max-width:12ch;font-weight:800}
.hero p{max-width:46ch;margin:14px 0 24px;opacity:.9;font-size:1.1rem}
.btn{border:0;border-radius:99px;padding:12px 24px;font-weight:700;cursor:pointer;background:var(--gold);color:#1b1b17;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #c5a46d55}
.btn.g{background:var(--green);color:#fff}.btn.o{background:none;border:1px solid var(--line);color:var(--ink)}.btn.d{background:#a33a2f;color:#fff}.btn.sm{padding:8px 16px;font-size:.88rem}
.search{background:var(--card);border-radius:var(--r);padding:16px;margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;color:var(--ink);box-shadow:0 20px 50px #0004}
label{font-size:.8rem;font-weight:600;color:var(--muted);display:block}
input,select,textarea{font-size:16px;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;margin-top:4px}
.err{color:#a33a2f;font-size:.8rem;min-height:1em}
input.bad,select.bad,textarea.bad{border-color:#a33a2f}
section{padding:56px 0}
h2{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.25s}
.card:hover{box-shadow:0 14px 34px #163d3217}
.card .im{aspect-ratio:4/3;background-size:cover;background-position:center;position:relative}
.card .b{padding:16px}
.fav{position:absolute;top:10px;right:10px;background:#fffd;border:0;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.price{font-weight:800;color:var(--green)}.sub{color:var(--muted);font-size:.88rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;background:#efeadd;margin:2px 3px 0 0}
.tag.ok{background:#dcefe5;color:#14523a}.tag.no{background:#f6dcd8;color:#8a2f25}.tag.wait{background:#f7ecd1;color:#7a5a12}
.dest{height:150px;border-radius:var(--r);background-size:cover;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:800;font-size:1.2rem;cursor:pointer;border:0;text-align:left}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.bar>*{flex:1 1 150px}
.chips label{display:inline-flex;gap:5px;align-items:center;margin:3px 8px 3px 0;font-weight:500;color:var(--ink)}.chips input{width:auto;margin:0}
.empty{text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 18px;cursor:pointer;font-weight:600}.tabs .on{background:var(--green);color:#fff;border-color:var(--green)}
.bk{display:flex;gap:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;flex-wrap:wrap}
.bk .im{width:150px;min-height:110px;border-radius:14px;background-size:cover;flex:none}
.bk .in{flex:1;min-width:200px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prof{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:24px}
.av{width:96px;height:96px;border-radius:50%;background:var(--green) center/cover;color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:800}
footer{background:var(--green);color:#dfe8e3;padding:40px 0;margin-top:30px}footer a{color:#fff;margin-right:18px;cursor:pointer;text-decoration:underline}
/* dialog + toast */
dialog{border:0;border-radius:24px;padding:0;width:min(760px,94vw);max-height:92vh;box-shadow:0 30px 80px #0006;background:var(--bg)}
dialog::backdrop{background:#0c241d99;backdrop-filter:blur(3px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.dh button{border:0;background:none;font-size:1.5rem;cursor:pointer}.db{padding:22px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.gal{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:16px}.gal div{background-size:cover;border-radius:14px;min-height:110px}.gal div:first-child{grid-row:span 2;min-height:230px}
.sum{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0}.sum div{display:flex;justify-content:space-between;padding:3px 0}
.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pv div{width:84px;height:70px;border-radius:10px;background-size:cover;position:relative;border:2px solid transparent;cursor:pointer}.pv div.cov{border-color:var(--gold)}
.toasts{position:fixed;top:78px;right:16px;z-index:200;display:grid;gap:8px}
.toast{background:var(--green);color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px #0004;animation:in .3s}
.skel{background:linear-gradient(90deg,#eee8da 25%,#f6f2e8 50%,#eee8da 75%);background-size:200%;animation:sk 1.1s infinite;border-radius:var(--r);height:260px}@keyframes sk{to{background-position:-200% 0}}
@media(max-width:759px){.toasts{top:12px}.bk .im{width:100%;height:130px}}

/* ===== Premium refinement layer (navbar untouched) ===== */
body{-webkit-font-smoothing:antialiased;letter-spacing:.005em}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:-.01em}
h2{font-size:clamp(2.1rem,5vw,3.3rem);margin-bottom:28px}
h3{font-size:1.4rem}
.hero{min-height:94vh;padding-bottom:72px}
.hero::before{background:radial-gradient(120% 90% at 50% 100%,#0b1f19ee 0%,#0b1f1966 55%,#0b1f1922 100%)}
.hero h1{font-size:clamp(3.2rem,10vw,7rem);max-width:10ch;line-height:.95;font-weight:600;letter-spacing:-.03em}
.hero p{font-size:1.15rem;max-width:42ch;margin:20px 0 28px;opacity:.92}
.search{background:rgba(255,255,255,.95);border:1px solid #fff;border-radius:28px;padding:20px;gap:14px;margin-top:40px;box-shadow:0 30px 70px #0006}
.search input,.search select{background:#f5f2ea;border-color:transparent}
.search input:focus,.search select:focus{border-color:var(--gold);background:#fff}
section{padding:84px 0}
#home section:nth-of-type(even){background:#f3efe5}
.card{border-radius:24px;border-color:#ece7da;box-shadow:0 1px 2px #0000000a,0 12px 32px #163d320d}
.card:hover{transform:translateY(-4px);box-shadow:0 24px 50px #163d3222}
.card .b{padding:20px}
.card .im{aspect-ratio:5/4}
.rate{position:absolute;left:14px;bottom:14px;background:#163d32d9;color:#fff;backdrop-filter:blur(8px);padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:700}
.fav{width:40px;height:40px;background:#ffffffe6;backdrop-filter:blur(6px);box-shadow:0 4px 14px #0002}
.price{font-size:1.2rem}
.tag{background:#f1ede2;color:#5b5440;font-weight:600;padding:4px 11px}.tag.ok{background:#dcefe5;color:#14523a}.tag.wait{background:#f7ecd1;color:#7a5a12}.tag.no{background:#f6dcd8;color:#8a2f25}
.btn{letter-spacing:.02em;padding:13px 28px}
.btn.g{box-shadow:0 8px 20px #163d3238}
.dest{height:210px;border-radius:24px;font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;transition:transform .3s,box-shadow .3s}
.dest:hover{transform:translateY(-4px);box-shadow:0 20px 40px #0003}
.prof,.bk{border-radius:24px;border-color:#ece7da;box-shadow:0 12px 32px #163d320d}
.tabs button{padding:10px 22px}
dialog{border-radius:28px}.dh h3{font-size:1.5rem}
.sum{border-radius:18px;border-color:#ece7da}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:0;box-shadow:0 0 0 3px #c5a46d33}
footer{padding:64px 0;margin-top:0}footer a{transition:color .2s}footer a:hover{color:var(--gold)}
.empty{border-radius:24px;background:#fff}
@media(max-width:759px){section{padding:56px 0}.hero{min-height:88vh}}

/* ===== Soft embossed cards (match navbar style) ===== */
.card,.bk,.prof,.empty{background:linear-gradient(#fff,#f2f2f0);border:2px solid #fff;border-radius:28px;box-shadow:0 18px 38px #0000001f,0 2px 6px #0000001a}
.card:hover{box-shadow:0 26px 50px #00000029,0 2px 6px #0000001a}
.card .im{margin:8px;border-radius:22px;aspect-ratio:4/3}
.card .b{padding:12px 18px 18px}
.bk{padding:12px}.bk .im{border-radius:20px}
.sum{background:linear-gradient(#fff,#f5f5f3);border:2px solid #fff;box-shadow:0 8px 20px #00000014}
.btn.o{background:linear-gradient(#fff,#efefed);border:2px solid #fff;box-shadow:0 6px 14px #0000001a}
.tabs button{background:linear-gradient(#fff,#efefed);border:2px solid #fff;box-shadow:0 6px 14px #0000001a}.tabs button.on{background:var(--green);border-color:var(--green)}

.gl{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:clamp(240px,42vw,440px)}
.gl div{background-size:cover;background-position:center;border-radius:24px;border:2px solid #fff;box-shadow:0 12px 28px #00000020}.gl div:first-child{grid-row:span 2}
.dp{display:grid;grid-template-columns:1.7fr 1fr;gap:32px;margin-top:32px;align-items:start}
.side{position:sticky;top:90px}
@media(max-width:859px){.dp{grid-template-columns:1fr}.side{position:static}}

/* ===== Top header (name left, saved icon right, rounded bottom) ===== */
.top{position:fixed;top:0;left:0;right:0;z-index:49;height:64px;background:rgba(22,61,50,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:0 0 28px 28px;box-shadow:0 12px 30px #0000003a;color:#fff}
.tw{max-width:1180px;margin:0 auto;height:100%;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.75rem;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.mk{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px #c5a46d40}
.sv{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff40;background:#ffffff1f;color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .25s,transform .15s}
.sv:hover{background:#ffffff33}.sv:active{transform:scale(.92)}
.sv svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.sb{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--gold);color:#1b1b17;font-size:.7rem;font-weight:800;display:grid;place-items:center}.sb:empty{display:none}
@media(min-width:760px){nav{top:80px}.page>section:first-child{padding-top:170px!important}}
@media(max-width:759px){.toasts{top:76px}}

/* ===== Mobile fixes ===== */
body{overflow-x:clip}
button,a,input,select,textarea{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body:has(dialog[open]){overflow:hidden}
input,select{min-height:44px;-webkit-appearance:none;appearance:none}
input[type=checkbox],input[type=range]{min-height:0;-webkit-appearance:auto;appearance:auto}
dialog{max-height:90dvh}
@media(max-width:759px){
 body{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
 nav{gap:8px;max-width:calc(100vw - 16px);bottom:calc(12px + env(safe-area-inset-bottom,0px))}
 .pill{padding:5px;gap:2px}
 nav button{height:44px;padding:0 10px;font-size:.82rem}
 nav button.on{padding:0 14px 0 12px}
 .on .lb{padding-left:6px}
 .circ{width:54px;height:54px;padding:0}
 .hero{min-height:88svh;padding-top:96px}
 .hero h1{font-size:clamp(2.8rem,14vw,4rem)}
 .search{padding:14px;gap:10px;margin-top:28px}
 .btn.sm{min-height:40px}
 .tabs{flex-wrap:nowrap;overflow-x:auto;margin-right:-20px;padding-right:20px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
 .tabs button{white-space:nowrap;flex:none}
 .dest{height:150px}
 .toasts{left:12px;right:12px}.toast{text-align:center}
 .prof{padding:16px}.bk{gap:12px}
 .dh{padding:14px 16px}.db{padding:16px}
 .dp{gap:22px}
}
@media(max-width:350px){.on .lb{max-width:0;opacity:0;padding:0}nav button.on{padding:0 12px}}

/* ===== Dialog centering + transparent header ===== */
dialog{margin:auto;inset:0}
.top{position:absolute;background:transparent;-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);box-shadow:none;color:var(--green)}
.top .sv{background:#ffffff80;border-color:#163d3240;color:var(--green)}
.top .sv:hover{background:#ffffffb0}
.onhero .top{color:#fff;text-shadow:0 1px 10px #0006}
.onhero .top .sv{background:#ffffff26;border-color:#ffffff66;color:#fff}

/* ===== Header stays fixed ===== */
.top{position:fixed;pointer-events:none}
.top .sv{pointer-events:auto}

/* ===== Horizontal scrolling rows ===== */
.hs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:18px;padding:6px 20px 30px;margin:0 -20px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.hs>*{flex:0 0 min(78vw,300px);scroll-snap-align:start}
.hs>.dest{flex-basis:min(62vw,230px)}
@media(max-width:759px){.hs{scrollbar-width:none}.hs::-webkit-scrollbar{display:none}}

.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid #fff;border-radius:18px;background:linear-gradient(#fff,#f5f5f3);box-shadow:0 8px 20px #00000014;margin-bottom:10px;color:var(--ink);font-size:.95rem;font-weight:500}
.opt input{width:auto;margin:4px 0 0;min-height:0;-webkit-appearance:auto;appearance:auto}

/* ===== Hero slideshow + buttons ===== */
.hero{padding-bottom:44px}
.hero::before{z-index:1}.hero .wrap{z-index:2}
.hsl{position:absolute;inset:0;z-index:0;overflow:hidden}
.hsl .sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease}
.hsl .sl.on{opacity:1}
.hbtn{display:flex;gap:12px;flex-wrap:nowrap;margin-top:6px}
.hbtn .btn{white-space:nowrap}
.hdots{display:flex;gap:8px;margin-top:22px}
.hdots button{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:#ffffff80;cursor:pointer;transition:width .3s,background .3s}
.hdots button.on{width:26px;background:var(--gold)}
@media(max-width:759px){.hero{padding-bottom:36px}.hbtn{gap:10px}.hbtn .btn{flex:1;padding:13px 8px;font-size:.88rem}}
</style>
</head>
<body>
<header class="top"><div class="tw"><div class="brand"><span class="mk"></span>Verdane</div><button class="sv" aria-label="Saved resorts" onclick="showSaved()"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg><span class="sb" id="sb"></span></button></div></header>
<nav aria-label="Main">
 <div class="pill">
  <button data-p="home" class="hm on" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lb">Home</span></button>
  <button data-p="resorts" aria-label="Resorts"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="lb">Resorts</span></button>
  <button data-p="activities" aria-label="Activities"><svg viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2M13 11v2M13 17v2"/></svg><span class="lb">Activities</span></button>
  <button data-p="profile" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span class="lb">Profile</span></button>
 </div>
 <button data-p="bookings" class="circ" aria-label="Bookings"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="bd" id="bd"></span></button>
</nav>
<main>
<div id="home" class="page on"></div><div id="resorts" class="page"></div><div id="activities" class="page"></div><div id="detail" class="page"></div><div id="checkout" class="page"></div><div id="bookings" class="page"></div><div id="profile" class="page"></div>
</main>
<footer><div class="wrap"><b>Verdane</b> — demo hospitality platform<p class="sub" style="color:#b9cbc3;margin:8px 0 14px">Demo only: no real bookings, payments or hotel inventory. A real version needs a secure backend, database, auth and payment gateway.</p>
<a data-info="About">About</a><a data-info="Contact">Contact</a><a data-info="Terms">Terms</a><a data-info="Privacy">Privacy</a></div></footer>
<dialog id="dlg"></dialog><div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ===== Helpers ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

${BT==='Tickets'?tix():L.length?L.map(b=>{const r=find(b.rid)||{name:'Removed property',city:'',state:'',img:scene('#999','#ddd')};return `<div class="bk"><div class="im" style='background-image:${r.id?cover(r):r.img}'></div><div class="in"><span class="tag ${b.status=='Upcoming'?'wait':b.status=='Completed'?'ok':'no'}">${b.status}</span><h3>${esc(r.name)}</h3><div class="sub">${esc(r.city)} · Ref ${b.id}<br>${b.in} → ${b.out} · ${b.room} · ${b.guests} guest${b.guests>1?'s':''} · ${esc(b.guest)}</div><div class="price" style="margin-top:4px">${money(b.total)}</div><div class="row"><button class="btn g sm" onclick="bView('${b.id}')">View details</button>${b.status=='Upcoming'?`<button class="btn o sm" onclick="bookForm('${b.rid}','${b.id}')">Modify</button><button class="btn d sm" onclick="bCancel('${b.id}')">Cancel</button>`:''}</div></div></div>`}).join(''):`<div class="empty"><h3>No ${BT==='All'?'':BT.toLowerCase()+' '}bookings yet</h3><p>Find a stay and your reservations will show up here.</p><button class="btn g sm" style="margin-top:12px" onclick="go('resorts')">Explore resorts</button></div>`}${BT==='All'&&S.tickets.length?tix():''}</div></section>`}

$('#lf').onsubmit=ev=>{ev.preventDefault();$$('#lf .err').forEach(x=>x.textContent='');const v=id=>$('#'+id).value.trim(),E={};

IMGS[id]=imgs;eid?S.props[S.props.findIndex(p=>p.id===id)]=o:S.props.unshift(o);save();
modal('Listing submitted',`<p><b>${esc(o.name)}</b> is now <span class="tag wait">${o.status}</span>.</p><p class="sub" style="margin:8px 0">Use the demo review buttons on your profile to mark it Published; it then appears on the Resorts page.</p><div class="row"><button class="btn" onclick="dlg.close();rProfile()">View my properties</button></div>`);rProfile()}}

const body=act?`<p class="sub">${esc(r.city)} · ★ ${r.rating.toFixed(1)} · ${r.dur} · ${r.cat}</p><h3 style="margin:22px 0 6px">About this experience</h3><p>${esc(r.desc)}</p><h3 style="margin:22px 0 6px">What\u2019s included</h3><p>${inc[r.cat].map(x=>`<span class="tag">${x}</span>`).join('')}</p><h3 style="margin:22px 0 6px">Good to know</h3><p class="sub">Slots at 9:00 AM, 1:00 PM and 4:30 PM. Arrive 15 minutes early. Children are charged at 50%. Free cancellation up to 24 hours before (sample policy).</p>`
:`<p class="sub">${esc(r.city)}, ${esc(r.state)} · ${stars(r)} · ${r.type}${r.address?' · '+esc(r.address):''}</p><h3 style="margin:22px 0 6px">About this stay</h3><p>${esc(r.desc)}</p><h3 style="margin:22px 0 6px">Amenities</h3><p>${r.am.map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</p><h3 style="margin:22px 0 6px">Room options</h3><div class="two">${Object.entries(ROOMS).map(([k,m])=>`<div class="sum"><b>${k}</b><div><span class="sub">per night</span><span class="price">${money(r.price*m)}</span></div></div>`).join('')}</div><h3 style="margin:22px 0 6px">Check-in & policies</h3><p class="sub">Check-in ${esc(r.cin||'2:00 PM')} · Check-out ${esc(r.cout||'11:00 AM')}<br>${esc(r.rules||'Free cancellation up to 48 hours before check-in (sample policy). Government ID required at arrival. No smoking indoors.')}</p>`;
$('#detail').innerHTML=`<section style="padding-top:100px"><div class="wrap"><button class="btn o sm" onclick="go('${D.from}')">\u2190 Back</button><div class="gl" style="margin-top:16px">${g.map(x=>`<div style='background-image:${x}'></div>`).join('')}</div><div class="dp"><div><h1 style="font-size:clamp(2.3rem,6vw,3.6rem)">${esc(r.name)}</h1>${body}</div><aside class="side card"><div class="b" style="padding:22px"><span class="sub">${act?'Per ticket':'From, per night'}</span><div class="price" style="font-size:2rem;margin:2px 0 14px">${money(r.price)}</div><button class="btn" style="width:100%" onclick="${act?`tForm('${r.id}')`:`bookForm('${r.id}')`}">${act?'Book tickets':'Book this stay'}</button>${act?'':`<button class="btn o" style="width:100%;margin-top:10px" onclick="fav('${r.id}')">${f?'\u2665 Saved':'\u2661 Save'}</button>`}<p class="sub" style="margin-top:12px">Demo booking: nothing is charged.</p></div></aside></div></div></section>`}
function showSaved(){const L=S.favs.map(find).filter(Boolean);modal('Saved resorts',L.length?L.map(r=>`<div class="bk" style="align-items:center;margin-bottom:10px"><div class="im" style='background-image:${cover(r)};width:90px;height:70px;min-height:70px'></div><div class="in"><b>${esc(r.name)}</b><div class="sub">${esc(r.city)} \u00b7 ${money(r.price)}/night</div></div><button class="btn g sm" onclick="dlg.close();detail('${r.id}')">View</button></div>`).join(''):'<div class="empty"><p>Nothing saved yet. Tap the heart on any resort to save it here.</p></div>')}
/* keep header text readable: white only while the hero is behind it */
addEventListener('scroll',()=>{const h=$('#home .hero');document.body.classList.toggle('onhero',$('#home').classList.contains('on')&&scrollY<(h?h.offsetHeight-80:0))},{passive:true});
/* ===== Checkout page (separate page, same file) ===== */
let CK=null;
function rCheckout(){if(!CK)return go('home');const T=CK.kind==='ticket',r=T?actOf(CK.id):find(CK.id);
const rows=T?`<div><span>${CK.d}, ${CK.sl}</span></div><div><span>${CK.t.ad} adult, ${CK.t.ch} child</span></div><div><span>Subtotal</span><span>${money(CK.t.sub)}</span></div><div><span>Taxes (5%, sample)</span><span>${money(CK.t.tax)}</span></div><div><b>Total</b><b class="price">${money(CK.t.total)}</b></div>`
:`<div><span>${CK.data.in} \u2192 ${CK.data.out}</span><span>${CK.n} night${CK.n>1?'s':''}</span></div><div><span>${CK.data.room} room, ${CK.data.guests} guest${CK.data.guests>1?'s':''}</span></div><div><span>Room charges</span><span>${money(CK.c.base)}</span></div><div><span>Taxes (12%, sample)</span><span>${money(CK.c.tax)}</span></div><div><span>Service fee (sample)</span><span>${money(CK.c.fee)}</span></div><div><b>Total</b><b class="price">${money(CK.c.total)}</b></div>`;
const who=T?CK.nm:CK.data.guest;
$('#checkout').innerHTML=`<section style="padding-top:100px"><div class="wrap"><button class="btn o sm" onclick="${T?`tForm('${CK.id}')`:`bookForm('${CK.id}')`}">\u2190 Edit details</button><h2 style="margin-top:16px">Checkout</h2><div class="dp"><div>
<h3>Guest details</h3><div class="sum"><div><span>Name</span><b>${esc(who)}</b></div><div><span>Email</span><span>${esc(CK.email)}</span></div>${T?'':`<div><span>Phone</span><span>${esc(CK.phone)}</span></div>`}</div>
<h3 style="margin-top:22px">Special requests</h3><textarea id="ckn" rows="3" placeholder="Anything we should tell the property? (optional)"></textarea>
<h3 style="margin:22px 0 10px">Payment</h3>
<label class="opt"><input type="radio" name="pay" checked><span><b>Pay at the ${T?'venue':'property'} (demo)</b><br><span class="sub">Nothing is charged in this demo.</span></span></label>
<label class="opt" style="opacity:.55"><input type="radio" name="pay" disabled><span><b>Pay online</b><br><span class="sub">Needs a real payment gateway and backend, so it\u2019s not available here. Never enter card details into a demo.</span></span></label>
<label class="opt" style="margin-top:14px"><input type="checkbox" id="ck"><span>I understand this is a front-end demo and not a real reservation.</span></label><div class="err" id="e_ck"></div>
</div><aside class="side card"><div class="im" style='background-image:${r.id&&!T?cover(r):r.img};aspect-ratio:16/9'></div><div class="b" style="padding:12px 20px 20px"><h3>${esc(r.name)}</h3><div class="sub">${esc(r.city)}</div><div class="sum">${rows}</div><button class="btn" style="width:100%" onclick="confirmCheckout()">Confirm ${T?'tickets':'booking'}</button></div></aside></div></div></section>`}
function confirmCheckout(){if(!$('#ck').checked){$('#e_ck').textContent='Please tick the box to continue';return}
const T=CK.kind==='ticket',note=$('#ckn').value.trim(),pre=T?'TKT-':'VRD-',ref=pre+Math.random().toString(36).slice(2,8).toUpperCase();
if(T){S.tickets.unshift({id:ref,aid:CK.id,guest:CK.nm,date:CK.d,slot:CK.sl,adults:CK.t.ad,children:CK.t.ch,total:CK.t.total,note,status:'Upcoming'});BT='Tickets'}
else{S.bookings.unshift({id:ref,rid:CK.id,status:'Upcoming',...CK.data,note});BT='All'}
save();BD=null;CK=null;
$('#checkout').innerHTML=`<section style="padding-top:100px"><div class="wrap"><div class="card" style="max-width:560px;margin:0 auto;text-align:center"><div class="b" style="padding:34px 24px"><h2 style="margin-bottom:10px">${T?'Tickets recorded':'Reservation recorded'}</h2><p>Your demo reference is <b>${ref}</b>.</p><p class="sub" style="margin:10px 0 20px">Front-end demonstration only. This is not a real ${T?'ticket':'reservation'}, and no payment was taken.</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('bookings')">View my bookings</button><button class="btn o" onclick="${T?`tPrint('${ref}')`:`bPrint('${ref}')`}">Print confirmation</button></div></div></div></div></section>`;scrollTo({top:0,behavior:'instant'})}
/* ===== Hero slideshow ===== */
let heroT,heroI=0;
function heroStart(){clearInterval(heroT);heroI=0;const sl=$$('.hsl .sl'),dt=$$('.hdots button');
const show=i=>{heroI=i;sl.forEach((x,k)=>x.classList.toggle('on',k===i));dt.forEach((x,k)=>x.classList.toggle('on',k===i))};
const restart=()=>{clearInterval(heroT);heroT=setInterval(()=>{if($('#home').classList.contains('on'))show((heroI+1)%sl.length)},4500)};
dt.forEach((x,k)=>x.onclick=()=>{show(k);restart()});show(0);restart()}
/* ===== Init ===== */
go(['home','resorts','activities','bookings','profile'].includes(location.hash.slice(1))?location.hash.slice(1):'home');
</script>
</body>
